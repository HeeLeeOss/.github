<svg width="1200" height="150" viewBox="0 0 1200 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Usage credits: 99% used — capacity put to work, for good.">
  <defs>
    <linearGradient id="cardBgG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="100%" stop-color="#FFF8EC"/>
    </linearGradient>
    <linearGradient id="fillGradG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCB47"/>
      <stop offset="55%" stop-color="#FF9A3C"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>
    <linearGradient id="goodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8862E"/>
      <stop offset="100%" stop-color="#D8552A"/>
    </linearGradient>
    <filter id="barGlow" x="-20%" y="-250%" width="140%" height="600%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="148" rx="18" fill="url(#cardBgG)" stroke="#F0D9AE" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="4" rx="2" fill="url(#fillGradG)" opacity="0.85"/>

  <text x="48" y="46" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#A9875A">USAGE CREDITS</text>

  <!-- glowing, nearly-full bar -->
  <rect x="48" y="78" width="560" height="14" rx="7" fill="#F7E7CB"/>
  <rect x="48" y="78" height="14" rx="7" fill="url(#fillGradG)" width="554" filter="url(#barGlow)" opacity="0.55">
    <animate attributeName="width" values="0;554" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>
  <rect x="48" y="78" height="14" rx="7" fill="url(#fillGradG)" width="554">
    <animate attributeName="width" values="0;554" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/>
  </rect>

  <text x="48" y="124" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#8A6A3A"><tspan font-weight="700" fill="#C1481F">99% used</tspan> &#183; nothing left to expire</text>

  <text x="660" y="98" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="31" font-weight="700" font-style="italic" fill="url(#goodGrad)">put to work, for good &#10024;</text>

  <!-- radiant check -->
  <g transform="translate(1122,56)">
    <circle cx="19" cy="19" r="19" fill="#FF9A3C" opacity="0.18">
      <animate attributeName="r" values="17;21;17" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="19" cy="19" r="15" fill="none" stroke="#E8862E" stroke-width="2.4"/>
    <path d="M 12 19.5 L 17 24.5 L 26.5 14" fill="none" stroke="#E8862E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
