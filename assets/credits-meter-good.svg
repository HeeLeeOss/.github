<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Usage credits: 99% used, 1% left open. Capacity put to work: 74% put to good deeds.">
  <defs>
    <linearGradient id="fillGradOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFCB47"/>
      <stop offset="100%" stop-color="#FF8247"/>
    </linearGradient>
    <linearGradient id="fillGradGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9CC98A"/>
      <stop offset="100%" stop-color="#4F8A3D"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="40" y="80" width="460" height="14" rx="7"/>
    </clipPath>
    <clipPath id="iconClip">
      <circle cx="946.0" cy="87.0" r="26"/>
    </clipPath>
    <filter id="haloWide" x="-100%" y="-800%" width="300%" height="1700%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="haloOuter" x="-90%" y="-600%" width="280%" height="1300%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="haloInner" x="-70%" y="-400%" width="240%" height="900%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="138" rx="14" fill="#FFFDF6" stroke="#F0D9AE" stroke-width="1.5"/>

  <text x="40" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#4A2E12">Usage Credits</text>

  <path d="M 495.4 77 L 486.4 59 L 504.4 59 Z" fill="#D8322A"/>

  <rect x="40" y="80" width="460" height="14" rx="7" fill="#FCEBD1"/>
  <rect x="155.0" y="80" width="340.4" height="14" rx="7" fill="#FFC93C" opacity="0.6" filter="url(#haloWide)"><animate attributeName="width" values="0;340.4" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></rect>
  <rect x="155.0" y="80" width="340.4" height="14" rx="7" fill="#FFC93C" opacity="0.85" filter="url(#haloOuter)"><animate attributeName="width" values="0;340.4" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></rect>
  <rect x="155.0" y="80" width="340.4" height="14" rx="7" fill="#FFF0C2" opacity="1" filter="url(#haloInner)"><animate attributeName="width" values="0;340.4" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></rect>
  <g clip-path="url(#barClip)">
    <rect x="40" y="80" width="115.0" height="14" fill="url(#fillGradOrange)"/>
    <rect x="155.0" y="80" width="340.4" height="14" fill="url(#fillGradGreen)"><animate attributeName="width" values="0;340.4" dur="1.2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" keyTimes="0;1"/></rect>
  </g>
  <text x="40" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#8A6A3A">99% used</text>

  <text x="546" y="93.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" font-style="italic" fill="#4F8A3D">Capacity put to work</text>
  <text x="546" y="121.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#000000">74% put to good deeds</text>

  <image x="920.0" y="61.0" width="52" height="52" clip-path="url(#iconClip)" xlink:href="data:image/png;base64," preserveAspectRatio="xMidYMid slice"/>
  <circle cx="946.0" cy="87.0" r="26" fill="none" stroke="#FFD199" stroke-width="2"/>

  <circle cx="1160" cy="26" r="17" fill="#3F9B3A"/>
  <path d="M 1152 26 L 1158 33 L 1170 17" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
